x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    mem_limit: 420m
    ports:
      # Chỉ bind localhost trên VPS để bảo mật (không public ra Internet)
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      CACHE_EXPIRE: ${RSSHUB_CACHE_EXPIRE:-1800}
      # Chỉ điền nếu bạn bật thêm profile browserless (VPS >= 2GB RAM hoặc có Swap)
      PLAYWRIGHT_CDP_ENDPOINT: ${PLAYWRIGHT_CDP_ENDPOINT:-}
      # Hỗ trợ nhiều token cách nhau bởi dấu phẩy để xoay vòng (VD: token1,token2)
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      REQUEST_TIMEOUT: 30000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # Tùy chọn: chỉ bật khi cần render trang JS nặng (chạy bằng: docker compose --profile browser up -d)
  browserless:
    image: ghcr.io/browserless/chromium
    profiles: ["browser"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-rsshub-local-token}
      CONCURRENT: 1
      TIMEOUT: 60000
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://localhost:3000/pressure?token=$$TOKEN\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging

  news-bot:
    build: .
    restart: unless-stopped
    mem_limit: 160m
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      RSSHUB_BASE_URL: http://rsshub:1200
      HISTORY_FILE: /app/data/seen_links.json
      FEEDS_FILE: /app/feeds.json
    volumes:
      - ./data:/app/data
      - ./feeds.json:/app/feeds.json:ro
    depends_on:
      rsshub:
        condition: service_healthy
    logging: *default-logging
